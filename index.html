<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>物品管理 - カット用A5</title>
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22物品管理%22,%22short_name%22:%22物品管理%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#2563eb%22}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* ===== 基本設定 ===== */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 8px;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ===== カードグリッド ===== */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            width: 100%;
            background: #ffffff;
            border: 1px solid #000;
            border-radius: 0;
        }

        /* 商品数が5個以上は3列 */
        .card-grid.mode-3col {
            grid-template-columns: repeat(3, 1fr);
        }

        /* ===== 個別商品カード ===== */
        .item-card {
            background: #ffffff;
            border: 1px solid #000;
            border-radius: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            page-break-inside: avoid;
            break-inside: avoid;
            margin: 0;
            overflow: hidden;
            min-width: 0;
        }

        /* カード間の罫線をきれいに（隣接ボーダー重複回避） */
        .item-card:not(:last-child) {
            border-right: none;
            border-bottom: none;
        }

        /* 3列モードでは右端のカードにも右ボーダーを付ける */
        .card-grid.mode-3col .item-card:nth-child(3n) {
            border-right: 1px solid #000;
        }

        /* 削除ボタン（画面のみ） */
        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding: 0;
            font-weight: bold;
        }

        /* タイトル（写真の上） */
        .item-title {
            font-size: 14px;
            font-weight: bold;
            color: #0f172a;
            border: none;
            border-bottom: 2px solid #2563eb;
            background: transparent;
            padding: 0 0 4px 0;
            width: 100%;
            font-family: inherit;
            outline: none;
            text-align: left;
        }

        /* スクエア写真エリア */
        .photo-area {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px dashed #94a3b8;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin: 0;
            flex-shrink: 0;
        }

        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-placeholder {
            font-size: 14px;
            color: #94a3b8;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        /* 備考（メモ） */
        .item-memo {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 2px 0;
            font-size: 12px;
            color: #0f172a;
            font-family: inherit;
            resize: none;
            height: 34px;
            outline: none;
            line-height: 1.3;
        }

        /* 下部情報エリア：左に価格・購入店・日付、右にQRコード */
        .bottom-info {
            display: flex;
            align-items: stretch;
            gap: 8px;
            flex: 1;
            min-height: 70px;
        }

        .left-fields {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
            min-width: 0;
        }

        .field-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
            font-size: 13px;
        }

        .field-row label {
            font-weight: bold;
            color: #475569;
            flex-shrink: 0;
            font-size: 13px;
        }

        .field-row input {
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 2px 0;
            font-size: 13px;
            font-weight: bold;
            color: #0f172a;
            font-family: inherit;
            outline: none;
            width: 100%;
            min-width: 0;
            text-align: left;
        }

        .price-input {
            color: #b91c1c !important;
            font-weight: bold !important;
        }

        /* QRコードエリア */
        .qr-area {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 60px;
        }

        .qr-code-container {
            display: flex;
            justify-content: center;
            width: 100%;
            line-height: 0;
        }

        .qr-code-container img {
            width: 55px !important;
            height: 55px !important;
            max-width: 100%;
        }

        /* URL入力（画面のみ表示、印刷時は非表示） */
        .url-edit {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            margin-top: 2px;
        }

        .url-edit input {
            border: 1px dashed #94a3b8;
            border-radius: 2px;
            background: #f8fafc;
            padding: 1px 3px;
            font-size: 9px;
            color: #2563eb;
            font-family: monospace;
            width: 100%;
            outline: none;
        }

        /* 操作ボタン */
        .no-print {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 100px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }

        .btn-secondary {
            background-color: #10b981;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        /* ===== 印刷時 ===== */
        @media print {
            @page {
                size: A5 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: #fff;
                display: block;
                width: 148mm;
                height: 210mm;
                overflow: hidden;
            }

            .app-container {
                max-width: 100%;
                width: 100%;
                gap: 0;
                padding: 0;
            }

            .no-print,
            .url-edit,
            .remove-btn {
                display: none !important;
            }

            .card-grid {
                gap: 0;
                border: 1px solid #000;
                width: 100%;
            }

            .item-card {
                border: 1px solid #000;
                border-radius: 0;
                padding: 6px 4px;
                gap: 4px;
                break-inside: avoid;
            }

            /* 隣接ボーダー調整 */
            .item-card:not(:last-child) {
                border-right: none;
                border-bottom: none;
            }

            .card-grid.mode-3col .item-card:nth-child(3n) {
                border-right: 1px solid #000;
            }

            .item-title {
                font-size: 13px;
                border-bottom-width: 1.5px;
                padding-bottom: 2px;
            }

            .photo-area {
                border: 1px solid #999;
            }

            .photo-placeholder {
                font-size: 12px;
            }

            .item-memo {
                font-size: 11px;
                height: 28px;
                border-bottom: 1px solid #cbd5e1;
            }

            .bottom-info {
                gap: 4px;
                min-height: 55px;
            }

            .field-row {
                font-size: 11px;
                gap: 2px;
            }

            .field-row label {
                font-size: 11px;
            }

            .field-row input {
                font-size: 11px;
                padding: 1px 0;
                border-bottom: 1px solid #cbd5e1;
            }

            .qr-area {
                width: 45px;
            }

            .qr-code-container img {
                width: 42px !important;
                height: 42px !important;
            }

            /* 全カードが1ページに収まるようにする */
            .card-grid {
                height: 210mm;
                align-content: start;
            }
        }

        /* ===== 画面表示の微調整 ===== */
        @media screen {
            .card-grid {
                border: 1px solid #000;
            }
            .item-card {
                border: 1px solid #000;
            }
            .url-edit {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="card-grid" id="cardGrid"></div>
        <div class="no-print">
            <button class="btn btn-secondary" onclick="addProduct()">＋ 商品を追加</button>
            <button class="btn" onclick="window.print()">印刷 / PDF保存</button>
            <button class="btn btn-danger" onclick="resetAll()">リセット</button>
        </div>
    </div>

    <script>
        // ===== データ管理 =====
        let products = []; // {id, title, memo, price, store, date, url, photo}
        const MAX_PRODUCTS = 6;
        const STORAGE_KEY = 'item_management_data_v2';

        // ===== 初期化 =====
        function init() {
            loadFromStorage();
            if (products.length === 0) {
                // 初回デフォルト4商品
                for (let i = 0; i < 4; i++) {
                    products.push({
                        id: generateId(),
                        title: '',
                        memo: '',
                        price: '',
                        store: '',
                        date: '',
                        url: 'https://amzn.asia/d/05mPK5Q5',
                        photo: null
                    });
                }
                setDefaultProductData(0);
                setDefaultProductData(1, 1);
                setDefaultProductData(2, 2);
                setDefaultProductData(3, 3);
                saveToStorage();
            }
            renderAllCards();
            updateGridMode();
        }

        function generateId() {
            return 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }

        // ===== デフォルトデータ =====
        function setDefaultProductData(index, variant = 0) {
            const defaults = [
                { title: 'エレコム USB Type-C ケーブル 2m L字 ホワイト', memo: 'USB-C to USB-C | 60W PD対応 | ナイロンメッシュ | MPA-CCECL20WH', price: '1,030円', store: 'Amazon', date: '2026-08-31', url: 'https://amzn.asia/d/05mPK5Q5' },
                { title: 'Anker PowerPort III 65W', memo: 'USB-C PD 65W | GaN搭載 | 折りたたみプラグ', price: '4,980円', store: 'ヨドバシカメラ', date: '2026-09-01', url: 'https://amzn.asia/d/example1' },
                { title: '無印良品 ステンレスボトル 500ml', memo: '保温・保冷 | ワンタッチオープン | 食洗機対応', price: '1,490円', store: '無印良品', date: '2026-08-28', url: 'https://amzn.asia/d/example2' },
                { title: 'Logicool MX Master 3S', memo: '静音クリック | 8K DPI | MagSpeedスクロール', price: '12,800円', store: 'Amazon', date: '2026-08-25', url: 'https://amzn.asia/d/example3' },
            ];
            const d = defaults[variant] || defaults[0];
            if (products[index]) {
                products[index].title = d.title;
                products[index].memo = d.memo;
                products[index].price = d.price;
                products[index].store = d.store;
                products[index].date = d.date;
                products[index].url = d.url;
            }
        }

        // ===== ローカルストレージ =====
        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
            } catch (e) {
                console.warn('保存失敗', e);
            }
        }

        function loadFromStorage() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    products = JSON.parse(data);
                    // 不要な要素を除去
                    products = products.filter(p => p && p.id);
                } catch (e) {
                    products = [];
                }
            }
        }

        // ===== カード生成 =====
        function renderAllCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            products.forEach((prod, index) => {
                const card = createCardElement(prod, index);
                grid.appendChild(card);
            });
        }

        function createCardElement(prod, index) {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.dataset.productId = prod.id;

            // タイトル
            const titleInput = document.createElement('input');
            titleInput.type = 'text';
            titleInput.className = 'item-title';
            titleInput.value = prod.title || '';
            titleInput.placeholder = '商品名';
            titleInput.addEventListener('input', () => { prod.title = titleInput.value; saveToStorage(); });

            // 写真エリア
            const photoArea = document.createElement('div');
            photoArea.className = 'photo-area';
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*';
            fileInput.style.display = 'none';
            fileInput.addEventListener('change', (e) => handlePhotoUpload(e, prod, photoArea));

            const placeholder = document.createElement('span');
            placeholder.className = 'photo-placeholder';
            placeholder.textContent = '📷';
            const img = document.createElement('img');
            img.style.display = 'none';
            if (prod.photo) {
                img.src = prod.photo;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            }

            photoArea.appendChild(placeholder);
            photoArea.appendChild(img);
            photoArea.appendChild(fileInput);
            photoArea.addEventListener('click', () => fileInput.click());

            // メモ
            const memoTextarea = document.createElement('textarea');
            memoTextarea.className = 'item-memo';
            memoTextarea.rows = 2;
            memoTextarea.value = prod.memo || '';
            memoTextarea.placeholder = '備考';
            memoTextarea.addEventListener('input', () => { prod.memo = memoTextarea.value; saveToStorage(); });

            // 下部情報
            const bottomInfo = document.createElement('div');
            bottomInfo.className = 'bottom-info';

            // 左側フィールド
            const leftFields = document.createElement('div');
            leftFields.className = 'left-fields';

            // 価格
            const priceRow = document.createElement('div');
            priceRow.className = 'field-row';
            const priceLabel = document.createElement('label');
            priceLabel.textContent = '価格';
            const priceInput = document.createElement('input');
            priceInput.type = 'text';
            priceInput.className = 'price-input';
            priceInput.value = prod.price || '';
            priceInput.placeholder = '0';
            priceInput.addEventListener('focus', (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, ''); });
            priceInput.addEventListener('blur', (e) => {
                let val = e.target.value.replace(/[^0-9]/g, '');
                if (val) {
                    e.target.value = Number(val).toLocaleString('ja-JP') + '円';
                    prod.price = e.target.value;
                } else {
                    e.target.value = '';
                    prod.price = '';
                }
                saveToStorage();
            });
            priceInput.addEventListener('input', (e) => {
                if (e.target.dataset.editing) {
                    prod.price = e.target.value;
                }
            });
            priceRow.appendChild(priceLabel);
            priceRow.appendChild(priceInput);

            // 購入店
            const storeRow = document.createElement('div');
            storeRow.className = 'field-row';
            const storeLabel = document.createElement('label');
            storeLabel.textContent = '購入店';
            const storeInput = document.createElement('input');
            storeInput.type = 'text';
            storeInput.value = prod.store || '';
            storeInput.placeholder = '店名';
            storeInput.addEventListener('input', () => { prod.store = storeInput.value; saveToStorage(); });
            storeRow.appendChild(storeLabel);
            storeRow.appendChild(storeInput);

            // 日付
            const dateRow = document.createElement('div');
            dateRow.className = 'field-row';
            const dateLabel = document.createElement('label');
            dateLabel.textContent = '日付';
            const dateInput = document.createElement('input');
            dateInput.type = 'date';
            dateInput.value = prod.date || '';
            dateInput.style.textAlign = 'left';
            dateInput.addEventListener('input', () => { prod.date = dateInput.value; saveToStorage(); });
            dateRow.appendChild(dateLabel);
            dateRow.appendChild(dateInput);

            leftFields.appendChild(priceRow);
            leftFields.appendChild(storeRow);
            leftFields.appendChild(dateRow);

            // QRコードエリア
            const qrArea = document.createElement('div');
            qrArea.className = 'qr-area';
            const qrContainer = document.createElement('div');
            qrContainer.className = 'qr-code-container';
            qrArea.appendChild(qrContainer);

            // URL編集（画面のみ）
            const urlEdit = document.createElement('div');
            urlEdit.className = 'url-edit';
            const urlInput = document.createElement('input');
            urlInput.type = 'url';
            urlInput.value = prod.url || '';
            urlInput.placeholder = 'https://...';
            urlInput.addEventListener('input', () => {
                prod.url = urlInput.value;
                saveToStorage();
                generateQRCode(qrContainer, prod.url);
            });
            urlEdit.appendChild(urlInput);
            // QRの下に配置（下部情報の外側でも良いが、ここではbottom-infoの下に追加）

            bottomInfo.appendChild(leftFields);
            bottomInfo.appendChild(qrArea);

            // URL編集をカードに追加（bottom-infoの下）
            // ただし印刷時は非表示

            // 削除ボタン
            const removeBtn = document.createElement('button');
            removeBtn.className = 'remove-btn';
            removeBtn.textContent = '×';
            removeBtn.title = '削除';
            removeBtn.addEventListener('click', () => removeProduct(prod.id));

            // カード組み立て
            card.appendChild(removeBtn);
            card.appendChild(titleInput);
            card.appendChild(photoArea);
            card.appendChild(memoTextarea);
            card.appendChild(bottomInfo);
            card.appendChild(urlEdit);

            // QRコード生成
            generateQRCode(qrContainer, prod.url);

            return card;
        }

        function generateQRCode(container, url) {
            container.innerHTML = '';
            if (url) {
                try {
                    new QRCode(container, {
                        text: url,
                        width: 55,
                        height: 55,
                        colorDark: '#0f172a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M
                    });
                } catch (e) {
                    console.warn('QR生成エラー', e);
                }
            }
        }

        function handlePhotoUpload(event, prod, photoArea) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                prod.photo = e.target.result;
                const img = photoArea.querySelector('img');
                const placeholder = photoArea.querySelector('.photo-placeholder');
                if (img) {
                    img.src = prod.photo;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                saveToStorage();
            };
            reader.readAsDataURL(file);
        }

        // ===== 商品追加・削除・リセット =====
        function addProduct() {
            if (products.length >= MAX_PRODUCTS) {
                alert('最大' + MAX_PRODUCTS + '商品まで登録できます。');
                return;
            }
            const newProd = {
                id: generateId(),
                title: '',
                memo: '',
                price: '',
                store: '',
                date: '',
                url: 'https://amzn.asia/d/05mPK5Q5',
                photo: null
            };
            products.push(newProd);
            saveToStorage();
            renderAllCards();
            updateGridMode();
        }

        function removeProduct(id) {
            if (products.length <= 1) {
                alert('最低1商品は必要です。');
                return;
            }
            products = products.filter(p => p.id !== id);
            saveToStorage();
            renderAllCards();
            updateGridMode();
        }

        function resetAll() {
            if (!confirm('全ての商品をリセットしますか？')) return;
            products = [];
            for (let i = 0; i < 4; i++) {
                products.push({
                    id: generateId(),
                    title: '',
                    memo: '',
                    price: '',
                    store: '',
                    date: '',
                    url: 'https://amzn.asia/d/05mPK5Q5',
                    photo: null
                });
            }
            setDefaultProductData(0);
            setDefaultProductData(1, 1);
            setDefaultProductData(2, 2);
            setDefaultProductData(3, 3);
            saveToStorage();
            renderAllCards();
            updateGridMode();
        }

        function updateGridMode() {
            const grid = document.getElementById('cardGrid');
            if (products.length > 4) {
                grid.classList.add('mode-3col');
            } else {
                grid.classList.remove('mode-3col');
            }
        }

        // ===== イベント登録 =====
        window.addEventListener('DOMContentLoaded', () => {
            init();
            // 印刷前調整
            window.addEventListener('beforeprint', () => {
                updateGridMode();
            });
        });
    </script>
</body>
</html>
