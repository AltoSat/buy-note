<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>物品管理 - カット用A5</title>
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22物品管理%22,%22short_name%22:%22物品管理%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#2563eb%22}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 8px;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0;
            width: 100%;
            background: transparent;
            border: none;
        }

        .card-grid.mode-3col {
            grid-template-columns: repeat(3, 1fr);
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 0;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            page-break-inside: avoid;
            break-inside: avoid;
            margin: 0;
            overflow: hidden;
            min-width: 0;
        }

        .item-card:not(:last-child) {
            border-right: none;
            border-bottom: none;
        }

        .card-grid.mode-3col .item-card:nth-child(3n) {
            border-right: 1px solid #d1d5db;
        }

        .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            padding: 0;
            font-weight: bold;
        }

        .photo-area {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 1px dashed #94a3b8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            margin: 0;
            flex-shrink: 0;
        }

        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }

        .photo-placeholder {
            font-size: 16px;
            color: #94a3b8;
            text-align: center;
            font-weight: bold;
            pointer-events: none;
            user-select: none;
        }

        .item-title {
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            border: none;
            border-bottom: 2px solid #2563eb;
            background: transparent;
            padding: 0 0 4px 0;
            width: 100%;
            font-family: inherit;
            outline: none;
            text-align: left;
        }

        .item-memo {
            width: 100%;
            border: none;
            border-bottom: 1px solid #cbd5e1;
            background: transparent;
            padding: 2px 0;
            font-size: 12px;
            color: #0f172a;
            font-family: inherit;
            resize: none;
            height: 24px;
            outline: none;
            line-height: 1.2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .bottom-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .field-row-full {
            width: 100%;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
            min-height: 24px;
            display: flex;
            align-items: center;
        }

        .field-row-full input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0;
            font-size: 15px;
            font-weight: bold;
            color: #0f172a;
            font-family: inherit;
            outline: none;
            text-align: center;
        }

        .field-row-duo {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .field-row-duo .duo-field {
            flex: 1;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
            min-height: 24px;
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .field-row-duo .duo-field input {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0;
            font-size: 15px;
            font-weight: bold;
            color: #0f172a;
            font-family: inherit;
            outline: none;
            text-align: center;
            min-width: 0;
        }

        .price-input {
            color: #b91c1c !important;
            font-weight: bold !important;
        }

        .qr-area {
            display: none;
            /* 編集画面では非表示 */
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 70px;
        }

        .qr-code-container {
            display: flex;
            justify-content: center;
            width: 100%;
            line-height: 0;
        }

        .qr-code-container img {
            width: 60px !important;
            height: 60px !important;
            max-width: 100%;
        }

        .url-edit {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            margin-top: 2px;
        }

        .url-edit input {
            border: 1px dashed #94a3b8;
            border-radius: 2px;
            background: #f8fafc;
            padding: 2px 4px;
            font-size: 12px;
            color: #2563eb;
            font-family: monospace;
            width: 100%;
            outline: none;
        }

        .no-print {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 8px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }

        .btn-secondary {
            background-color: #10b981;
        }
        .btn-info {
            background-color: #8b5cf6;
        }
        .btn-danger {
            background-color: #ef4444;
        }

        @media print {
            @page {
                size: A5 portrait;
                margin: 0;
            }

            body {
                margin: 0;
                padding: 0;
                background: #fff;
                display: block;
                width: 148mm;
                height: 210mm;
                overflow: hidden;
            }

            .app-container {
                max-width: 100%;
                width: 100%;
                gap: 0;
                padding: 0;
            }

            .no-print,
            .url-edit,
            .remove-btn {
                display: none !important;
            }

            .card-grid {
                gap: 0;
                border: none;
                width: 100%;
            }

            .item-card {
                border: 1px solid #d1d5db;
                border-radius: 0;
                padding: 6px 5px;
                gap: 5px;
            }

            .item-card:not(:last-child) {
                border-right: none;
                border-bottom: none;
            }

            .card-grid.mode-3col .item-card:nth-child(3n) {
                border-right: 1px solid #d1d5db;
            }

            .item-title {
                font-size: 14px;
                border-bottom-width: 1.5px;
                padding-bottom: 2px;
            }

            .photo-area {
                border: 1px solid #999;
                border-radius: 8px;
            }

            .photo-area img {
                border-radius: 8px;
            }

            .photo-placeholder {
                font-size: 12px;
            }

            .item-memo {
                font-size: 10px;
                height: 20px;
                border-bottom: 1px solid #cbd5e1;
                white-space: nowrap;
                text-overflow: ellipsis;
            }

            .bottom-info {
                gap: 3px;
            }

            .field-row-full,
            .field-row-duo .duo-field {
                font-size: 12px;
                min-height: 20px;
                border-bottom: 1px solid #cbd5e1;
            }

            .field-row-full input,
            .field-row-duo .duo-field input {
                font-size: 12px;
                text-align: center;
            }

            .qr-area {
                display: flex !important;
                width: 50px;
            }

            .qr-code-container img {
                width: 45px !important;
                height: 45px !important;
            }

            .card-grid {
                height: 210mm;
                align-content: start;
            }
        }

        @media screen {
            .card-grid {
                border: none;
            }
            .item-card {
                border: 1px solid #d1d5db;
            }
            .url-edit {
                display: flex;
            }
            .qr-area {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="card-grid" id="cardGrid"></div>
        <div class="no-print">
            <button class="btn btn-secondary" onclick="addProduct()">＋ 追加</button>
            <button class="btn btn-info" onclick="saveAllToMemo()">📝 メモ保存</button>
            <button class="btn" onclick="window.print()">🖨️ 印刷</button>
            <button class="btn btn-danger" onclick="resetAll()">リセット</button>
        </div>
    </div>

    <script>
        (function() {
            let products = [];
            const MAX_PRODUCTS = 6;
            const STORAGE_KEY = 'item_management_data_v5';

            function generateId() {
                return 'p' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
                } catch (e) {
                    console.warn('保存失敗', e);
                }
            }

            function loadFromStorage() {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (Array.isArray(parsed)) {
                            products = parsed.filter(p => p && p.id);
                        }
                    } catch (e) {
                        products = [];
                    }
                }
            }

            function getDefaultProducts() {
                const defaults = [
                    { title: 'エレコム USB Type-C ケーブル 2m L字 ホワイト', memo: 'USB-C to USB-C | 60W PD対応', price: '1,030円', store: 'Amazon', date: '2026-08-31', url: 'https://amzn.asia/d/05mPK5Q5', photo: null },
                    { title: 'Anker PowerPort III 65W', memo: 'USB-C PD 65W | GaN搭載', price: '4,980円', store: 'ヨドバシカメラ', date: '2026-09-01', url: 'https://amzn.asia/d/example1', photo: null },
                    { title: '無印良品 ステンレスボトル 500ml', memo: '保温・保冷 | ワンタッチオープン', price: '1,490円', store: '無印良品', date: '2026-08-28', url: 'https://amzn.asia/d/example2', photo: null },
                    { title: 'Logicool MX Master 3S', memo: '静音クリック | 8K DPI', price: '12,800円', store: 'Amazon', date: '2026-08-25', url: 'https://amzn.asia/d/example3', photo: null },
                ];
                return defaults;
            }

            function init() {
                loadFromStorage();
                if (products.length === 0) {
                    products = getDefaultProducts().map(p => ({ ...p, id: generateId() }));
                    saveToStorage();
                }
                renderAllCards();
                updateGridMode();
            }

            function renderAllCards() {
                const grid = document.getElementById('cardGrid');
                grid.innerHTML = '';
                products.forEach(prod => {
                    grid.appendChild(createCardElement(prod));
                });
            }

            function createCardElement(prod) {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.dataset.productId = prod.id;

                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.title = '削除';
                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeProduct(prod.id);
                });

                const photoArea = document.createElement('div');
                photoArea.className = 'photo-area';
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.style.display = 'none';
                fileInput.addEventListener('change', (e) => handlePhotoUpload(e, prod, photoArea));

                const placeholder = document.createElement('span');
                placeholder.className = 'photo-placeholder';
                placeholder.textContent = '📷';
                const img = document.createElement('img');
                img.style.display = 'none';
                if (prod.photo) {
                    img.src = prod.photo;
                    img.style.display = 'block';
                    placeholder.style.display = 'none';
                }

                photoArea.appendChild(placeholder);
                photoArea.appendChild(img);
                photoArea.appendChild(fileInput);
                photoArea.addEventListener('click', () => fileInput.click());

                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.className = 'item-title';
                titleInput.value = prod.title || '';
                titleInput.placeholder = '商品名';
                titleInput.addEventListener('input', () => {
                    prod.title = titleInput.value;
                    saveToStorage();
                });

                const memoTextarea = document.createElement('textarea');
                memoTextarea.className = 'item-memo';
                memoTextarea.rows = 1;
                memoTextarea.value = prod.memo || '';
                memoTextarea.placeholder = '備考';
                memoTextarea.addEventListener('input', () => {
                    prod.memo = memoTextarea.value;
                    autoResizeMemo(memoTextarea);
                    saveToStorage();
                });
                setTimeout(() => autoResizeMemo(memoTextarea), 0);

                const bottomInfo = document.createElement('div');
                bottomInfo.className = 'bottom-info';

                // 価格行（全幅）
                const priceRow = document.createElement('div');
                priceRow.className = 'field-row-full';
                const priceInput = document.createElement('input');
                priceInput.type = 'text';
                priceInput.className = 'price-input';
                priceInput.value = prod.price || '';
                priceInput.placeholder = '価格';
                priceInput.addEventListener('focus', (e) => {
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                });
                priceInput.addEventListener('blur', (e) => {
                    let val = e.target.value.replace(/[^0-9]/g, '');
                    if (val) {
                        e.target.value = Number(val).toLocaleString('ja-JP') + '円';
                        prod.price = e.target.value;
                    } else {
                        e.target.value = '';
                        prod.price = '';
                    }
                    saveToStorage();
                });
                priceInput.addEventListener('input', (e) => {
                    prod.price = e.target.value;
                });
                priceRow.appendChild(priceInput);

                // 店舗＋日付行（2分割）
                const duoRow = document.createElement('div');
                duoRow.className = 'field-row-duo';

                const storeField = document.createElement('div');
                storeField.className = 'duo-field';
                const storeInput = document.createElement('input');
                storeInput.type = 'text';
                storeInput.value = prod.store || '';
                storeInput.placeholder = '店舗';
                storeInput.addEventListener('input', () => {
                    prod.store = storeInput.value;
                    saveToStorage();
                });
                storeField.appendChild(storeInput);

                const dateField = document.createElement('div');
                dateField.className = 'duo-field';
                const dateInput = document.createElement('input');
                dateInput.type = 'date';
                dateInput.value = prod.date || '';
                dateInput.style.textAlign = 'center';
                dateInput.addEventListener('input', () => {
                    prod.date = dateInput.value;
                    saveToStorage();
                });
                dateField.appendChild(dateInput);

                duoRow.appendChild(storeField);
                duoRow.appendChild(dateField);

                bottomInfo.appendChild(priceRow);
                bottomInfo.appendChild(duoRow);

                // QR（印刷時のみ表示）
                const qrArea = document.createElement('div');
                qrArea.className = 'qr-area';
                const qrContainer = document.createElement('div');
                qrContainer.className = 'qr-code-container';
                qrArea.appendChild(qrContainer);
                bottomInfo.appendChild(qrArea);

                const urlEdit = document.createElement('div');
                urlEdit.className = 'url-edit';
                const urlInput = document.createElement('input');
                urlInput.type = 'url';
                urlInput.value = prod.url || '';
                urlInput.placeholder = 'https://...';
                urlInput.addEventListener('input', () => {
                    prod.url = urlInput.value;
                    saveToStorage();
                    generateQRCode(qrContainer, prod.url);
                });
                urlEdit.appendChild(urlInput);

                card.appendChild(removeBtn);
                card.appendChild(photoArea);
                card.appendChild(titleInput);
                card.appendChild(memoTextarea);
                card.appendChild(bottomInfo);
                card.appendChild(urlEdit);

                generateQRCode(qrContainer, prod.url);
                return card;
            }

            function autoResizeMemo(textarea) {
                textarea.style.height = '24px';
                const maxFontSize = 12;
                const minFontSize = 8;
                textarea.style.fontSize = maxFontSize + 'px';
                while (textarea.scrollWidth > textarea.clientWidth && parseInt(textarea.style.fontSize) > minFontSize) {
                    let current = parseInt(textarea.style.fontSize);
                    textarea.style.fontSize = (current - 1) + 'px';
                }
                textarea.style.height = '24px';
            }

            function generateQRCode(container, url) {
                container.innerHTML = '';
                if (url) {
                    try {
                        new QRCode(container, {
                            text: url,
                            width: 60,
                            height: 60,
                            colorDark: '#0f172a',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (e) {
                        console.warn('QR生成エラー', e);
                    }
                }
            }

            function handlePhotoUpload(event, prod, photoArea) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxSize = 500;
                        let width = img.width;
                        let height = img.height;
                        if (width > height && width > maxSize) {
                            height = Math.round((height * maxSize) / width);
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = Math.round((width * maxSize) / height);
                            height = maxSize;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        prod.photo = compressedDataUrl;
                        saveToStorage();
                        const imgElement = photoArea.querySelector('img');
                        const placeholderEl = photoArea.querySelector('.photo-placeholder');
                        if (imgElement && placeholderEl) {
                            imgElement.src = compressedDataUrl;
                            imgElement.style.display = 'block';
                            placeholderEl.style.display = 'none';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function addProduct() {
                if (products.length >= MAX_PRODUCTS) {
                    alert('最大' + MAX_PRODUCTS + '商品まで登録できます。');
                    return;
                }
                const newProd = {
                    id: generateId(),
                    title: '',
                    memo: '',
                    price: '',
                    store: '',
                    date: '',
                    url: 'https://amzn.asia/d/05mPK5Q5',
                    photo: null
                };
                products.push(newProd);
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function removeProduct(id) {
                if (products.length <= 1) {
                    alert('最低1商品は必要です。');
                    return;
                }
                products = products.filter(p => p.id !== id);
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function resetAll() {
                if (!confirm('全ての商品をリセットしますか？')) return;
                products = getDefaultProducts().map(p => ({ ...p, id: generateId() }));
                saveToStorage();
                renderAllCards();
                updateGridMode();
            }

            function updateGridMode() {
                const grid = document.getElementById('cardGrid');
                if (products.length > 4) {
                    grid.classList.add('mode-3col');
                } else {
                    grid.classList.remove('mode-3col');
                }
            }

            // ===== メモ保存機能 =====
            async function saveAllToMemo() {
                if (products.length === 0) {
                    alert('保存する商品がありません。');
                    return;
                }

                const memos = [];
                for (const prod of products) {
                    let text = '';
                    if (prod.title) text += `📦 ${prod.title}\n`;
                    if (prod.price) text += `💰 ${prod.price}\n`;
                    if (prod.store) text += `🏪 ${prod.store}\n`;
                    if (prod.date) text += `📅 ${prod.date}\n`;
                    if (prod.memo) text += `📝 ${prod.memo}\n`;
                    if (prod.url) text += `🔗 ${prod.url}\n`;
                    if (prod.photo) text += `\n[写真添付]\n`;
                    memos.push({ text, photo: prod.photo, title: prod.title || '商品' });
                }

                for (const memo of memos) {
                    try {
                        if (navigator.share) {
                            const shareData = {
                                title: memo.title,
                                text: memo.text,
                            };
                            if (memo.photo) {
                                // 写真をBlobに変換してシェア
                                const blob = await (await fetch(memo.photo)).blob();
                                const file = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
                                shareData.files = [file];
                            }
                            await navigator.share(shareData);
                            // 少し待ってから次のシェアへ
                            await new Promise(r => setTimeout(r, 800));
                        } else {
                            // フォールバック：テキストのみコピー
                            await navigator.clipboard.writeText(memo.text);
                            alert('メモ内容をクリップボードにコピーしました。\n写真は手動で保存してください。');
                            break;
                        }
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.warn('シェア失敗', err);
                            alert('メモ保存が中断されました。');
                        }
                        break;
                    }
                }
            }

            window.addEventListener('DOMContentLoaded', init);
            window.addEventListener('beforeprint', updateGridMode);

            window.addProduct = addProduct;
            window.resetAll = resetAll;
            window.removeProduct = removeProduct;
            window.saveAllToMemo = saveAllToMemo;
        })();
    </script>
</body>
</html>
